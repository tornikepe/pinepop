<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PINEPOP — ადმინი</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍍</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Noto+Sans+Georgian:wdth,wght@62.5..100,100..900&family=Instrument+Serif:ital@0;1&display=swap"
    />
    <link rel="stylesheet" href="./admin.css" />
    <script>
      // theme before first paint, so there is no flash of the wrong one
      try {
        const t = localStorage.getItem('pp-admin-theme');
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <!-- LOGIN -->
    <main class="login" id="loginView" hidden>
      <form class="login__card" id="loginForm">
        <div class="brand brand--big">PINE<em>POP</em></div>
        <p class="muted">მართვის პანელი</p>
        <label class="field">
          <span>ლოგინი</span>
          <input name="username" autocomplete="username" required autofocus />
        </label>
        <label class="field">
          <span>პაროლი</span>
          <input name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="btn btn--primary btn--wide" type="submit">შესვლა</button>
        <p class="form-error" id="loginError" role="alert"></p>
      </form>
    </main>

    <!-- APP -->
    <div class="shell" id="appView" hidden>
      <aside class="side" id="side">
        <a class="brand side__brand" href="#/dashboard">PINE<em>POP</em></a>
        <nav class="side__nav" id="nav" aria-label="ადმინის მენიუ"></nav>
        <div class="side__foot">
          <a class="side__link" href="/" target="_blank" rel="noopener" data-icon="external">საიტის ნახვა</a>
        </div>
      </aside>
      <div class="side-scrim" id="sideScrim"></div>

      <div class="main">
        <header class="top">
          <button class="icon-btn top__menu" id="menuBtn" aria-label="მენიუ" data-icon="menu"></button>
          <div class="top__title" id="pageTitle"></div>
          <div class="top__actions">
            <button class="icon-btn" id="themeBtn" aria-label="თემის შეცვლა" data-icon="moon"></button>
            <a class="top__user" href="#/account" id="whoami"></a>
            <button class="icon-btn" id="logoutBtn" aria-label="გასვლა" data-icon="logout"></button>
          </div>
        </header>
        <main class="view" id="view" tabindex="-1"></main>
      </div>
    </div>

    <dialog class="modal" id="modal"></dialog>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <div class="tooltip" id="tooltip" role="tooltip" hidden></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
